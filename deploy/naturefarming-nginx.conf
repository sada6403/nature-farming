server {
    if ($host = www.naturefarming.lk) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = naturefarming.lk) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name naturefarming.lk www.naturefarming.lk;
    return 404; # managed by Certbot
}

server {
    if ($host = admin.naturefarming.lk) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name admin.naturefarming.lk;
    return 404; # managed by Certbot
